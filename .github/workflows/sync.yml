name: sync-catalog

# 每天 UTC 03:00（北京 11:00）检查官网是否有新剧/新集；
# 有变化就抓下来、重新生成站点、提交并触发 Cloudflare Pages 自动部署。
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

concurrency:
  group: sync-catalog
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 海外 runner 直连源站；若被 WAF 拦，可在这里注入 DB_PROXY 走自建代理
      - name: Sync catalog
        env:
          DB_PROXY: ""
          THREADS: "8"
        run: python tools/sync.py

      - name: Commit if changed
        run: |
          git config user.name "dranabox-sync-bot"
          git config user.email "sync-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore(sync): 同步官网新内容 $(date -u +%Y-%m-%d)"
            git push
          fi
